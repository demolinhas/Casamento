<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Vídeo com Auto-Play</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Proporção 16:9 */
            height: 0;
            overflow: hidden;
            margin: 25px 0;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        .note {
            background-color: #fff4e5;
            padding: 15px;
            border-left: 4px solid #ffa500;
            text-align: left;
            margin: 20px 0;
            border-radius: 4px;
        }
        .steps {
            text-align: left;
            background-color: #f0f8ff;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
        }
        .steps h2 {
            color: #2c3e50;
            margin-top: 0;
        }
        .steps ol {
            padding-left: 20px;
        }
        .steps li {
            margin-bottom: 10px;
        }
        footer {
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 0.9em;
        }
    </style>
</head>
        
        <div class="video-container">
            <!-- Substitua a URL abaixo pelo link do seu vídeo -->
            <video controls autoplay muted playsinline>
                <source src="https://drive.google.com/file/d/1TVppK79MJ6YlYiH_m3p1xRRsAifTvN8R/view?usp=sharing">
                Seu navegador não suporta a tag de vídeo.
            </video>
        </div>
        
</body>
</html>
